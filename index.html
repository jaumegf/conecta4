<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conecta 4 — IA Battle Arena</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --p1: #e63946;
  --p1-glow: rgba(230,57,70,0.55);
  --p1-dim: rgba(230,57,70,0.18);
  --p2: #ffd166;
  --p2-glow: rgba(255,209,102,0.55);
  --p2-dim: rgba(255,209,102,0.18);
  --board: #1340a0;
  --board-deep: #0b2566;
  --hole: #07142e;
  --bg: #050d1c;
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.09);
  --text: #dde8f8;
  --muted: #6b85b5;
  --cell: 76px;
  --gap: 9px;
}

html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── ambient background ── */
body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 55%, rgba(19,64,160,.22) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 20%, rgba(230,57,70,.10) 0%, transparent 60%),
    radial-gradient(ellipse 45% 40% at 75% 82%, rgba(255,209,102,.08) 0%, transparent 60%);
  pointer-events:none; z-index:0;
}

/* ── screens ── */
.screen { display:none; flex-direction:column; align-items:center; gap:1.75rem; position:relative; z-index:1; }
.screen.active { display:flex; }

/* ── title ── */
.logo {
  font-size: 3.2rem;
  font-weight: 900;
  letter-spacing: -0.03em;
  line-height: 1;
  background: linear-gradient(135deg, var(--p1) 30%, var(--p2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.logo-sub {
  text-align:center; font-size:.8rem; font-weight:600;
  color: var(--muted); letter-spacing:.15em; text-transform:uppercase; margin-top:.25rem;
}

/* ── setup panel ── */
.setup-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 1.75rem 2rem;
  display: flex; flex-direction:column; gap:1.4rem;
  min-width: 390px;
  backdrop-filter: blur(12px);
}

.player-row {
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
}

.player-label {
  display:flex; align-items:center; gap:.65rem;
  font-weight:700; font-size:.95rem;
}

.chip {
  width:26px; height:26px; border-radius:50%; flex-shrink:0;
}
.chip.p1 { background:var(--p1); box-shadow:0 0 10px var(--p1-glow); }
.chip.p2 { background:var(--p2); box-shadow:0 0 10px var(--p2-glow); }

.toggle {
  display:flex; background:rgba(0,0,0,.35);
  border-radius:10px; padding:3px; gap:3px;
}
.toggle-btn {
  padding:.38rem .95rem; border:none; border-radius:8px;
  cursor:pointer; font-size:.82rem; font-weight:700;
  background:transparent; color:var(--muted);
  transition: all .2s;
  font-family: inherit;
}
.toggle-btn.active { background:rgba(255,255,255,.13); color:var(--text); }

.setup-note {
  border-top: 1px solid var(--border);
  padding-top: 1rem;
  text-align:center; color:var(--muted); font-size:.84rem;
}

/* ── buttons ── */
.btn-main {
  padding:.9rem 2.8rem; font-size:1rem; font-weight:800;
  border:none; border-radius:13px; cursor:pointer;
  background: linear-gradient(135deg, var(--p1), #b5121f);
  color:#fff; letter-spacing:.06em; text-transform:uppercase;
  box-shadow:0 4px 22px rgba(230,57,70,.45);
  transition: all .2s; font-family:inherit;
}
.btn-main:hover { transform:translateY(-2px); box-shadow:0 7px 30px rgba(230,57,70,.55); }

.btn-ghost {
  padding:.55rem 1.3rem; font-size:.85rem; font-weight:600;
  border:1px solid var(--border); border-radius:9px;
  background: var(--surface); color:var(--text);
  cursor:pointer; transition: all .2s; font-family:inherit;
}
.btn-ghost:hover { background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.22); }

/* ── game header ── */
.game-header {
  display:flex; align-items:center; justify-content:space-between;
  width: calc(var(--cell)*7 + var(--gap)*8);
}

.player-card {
  display:flex; flex-direction:column; align-items:center; gap:.3rem;
  padding:.6rem 1.1rem; border-radius:11px;
  border:1px solid transparent; transition: all .3s;
  min-width:132px;
}
.player-card.active.c1 { background:var(--p1-dim); border-color:rgba(230,57,70,.45); }
.player-card.active.c2 { background:var(--p2-dim); border-color:rgba(255,209,102,.45); }

.pcard-name { font-size:.78rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; }
.pcard-score { font-size:1.6rem; font-weight:900; line-height:1; }
.pcard-score.c1 { color:var(--p1); }
.pcard-score.c2 { color:var(--p2); }
.pcard-badge {
  font-size:.7rem; padding:2px 8px; border-radius:20px;
  background:rgba(255,255,255,.07); color:var(--muted);
}

/* ── status bar ── */
.status {
  height:1.8rem; display:flex; align-items:center; justify-content:center;
  font-size:.9rem; color:var(--muted); gap:.5rem;
}
.status b { color:var(--text); }

.dots { display:inline-flex; gap:4px; align-items:center; }
.dot {
  width:6px; height:6px; border-radius:50%;
  background:var(--muted);
  animation: bounce 1s ease infinite;
}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce {
  0%,80%,100%{transform:translateY(0);opacity:.35}
  40%{transform:translateY(-7px);opacity:1}
}

/* ── board area ── */
.board-wrap { position:relative; }

/* drop zone */
.dropzone {
  display:flex; gap:var(--gap);
  padding: 0 var(--gap);
  height: 40px; margin-bottom:3px;
}
.dropcol {
  width:var(--cell); display:flex;
  align-items:center; justify-content:center;
  cursor:pointer; border-radius:8px;
  transition: background .15s;
}
.dropcol:hover { background:rgba(255,255,255,.05); }
.droparrow {
  width:0; height:0;
  border-left:9px solid transparent;
  border-right:9px solid transparent;
  border-top:0 solid transparent;
  opacity:0; transition: all .2s;
}
.dropcol:hover .droparrow { border-top-width:11px; opacity:.75; }
.droparrow.c1 { border-top-color: var(--p1); }
.droparrow.c2 { border-top-color: var(--p2); }

/* board */
.board {
  background: var(--board);
  border-radius:15px;
  padding:var(--gap);
  display:grid;
  grid-template-rows: repeat(6, var(--cell));
  grid-template-columns: repeat(7, var(--cell));
  gap:var(--gap);
  box-shadow:
    0 10px 50px rgba(0,0,0,.6),
    0 0 0 3px var(--board-deep),
    inset 0 2px 0 rgba(255,255,255,.08);
  position:relative;
}

/* cells */
.cell {
  width:var(--cell); height:var(--cell); border-radius:50%;
  background:var(--hole);
  box-shadow: inset 0 5px 12px rgba(0,0,0,.7), inset 0 -2px 4px rgba(255,255,255,.04);
  position:relative; overflow:visible;
}

.cell.p1 {
  background: radial-gradient(circle at 38% 35%, rgba(255,120,120,.6), var(--p1) 55%);
  box-shadow: inset 0 -5px 10px rgba(0,0,0,.3), 0 0 18px var(--p1-glow);
}
.cell.p2 {
  background: radial-gradient(circle at 38% 35%, rgba(255,245,160,.7), var(--p2) 55%);
  box-shadow: inset 0 -5px 10px rgba(0,0,0,.3), 0 0 18px var(--p2-glow);
}

/* drop animation — piece falls from variable height */
@keyframes fall {
  0%   { transform:translateY(var(--fall-from)); opacity:.9; }
  80%  { transform:translateY(4px); }
  92%  { transform:translateY(-5px); }
  100% { transform:translateY(0); opacity:1; }
}
.falling { animation: fall .38s cubic-bezier(.25,.46,.45,.94) forwards; }

/* win pulse */
@keyframes pulse-win {
  0%   { transform:scale(.93); }
  100% { transform:scale(1.06); }
}
.win-cell { animation: pulse-win .55s ease-in-out infinite alternate; }

/* ── end overlay ── */
.overlay {
  position:absolute; inset:0; border-radius:15px;
  background:rgba(5,13,28,.86);
  backdrop-filter:blur(8px);
  display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:1.4rem;
  z-index:20;
}
.overlay.show { display:flex; }

.win-msg {
  font-size:1.9rem; font-weight:900; letter-spacing:-.01em;
  animation: fadeUp .4s ease forwards;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:translateY(0); }
}
.win-msg.c1 { color:var(--p1); text-shadow:0 0 35px var(--p1-glow); }
.win-msg.c2 { color:var(--p2); text-shadow:0 0 35px var(--p2-glow); }
.win-msg.draw { color:var(--text); }

.end-btns { display:flex; gap:.9rem; }

.btn-replay {
  padding:.7rem 1.7rem; font-size:.95rem; font-weight:800;
  border:none; border-radius:11px; cursor:pointer;
  background:linear-gradient(135deg,var(--p1),#b5121f);
  color:#fff; box-shadow:0 4px 18px rgba(230,57,70,.4);
  transition:all .2s; font-family:inherit;
}
.btn-replay:hover { transform:translateY(-2px); }

/* ai tag */
.ai-tag {
  display:inline-block; font-size:.65rem; font-weight:700;
  padding:2px 7px; border-radius:20px; vertical-align:middle; margin-left:4px;
  background:rgba(255,255,255,.12); color:var(--muted); letter-spacing:.04em;
}

/* center */
.center { display:flex; flex-direction:column; align-items:center; gap:.25rem; }
.vs-label { font-size:.72rem; font-weight:800; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; }

/* disclaimer */
.disclaimer { color:var(--muted); font-size:.72rem; opacity:.55; text-align:center; }
</style>
</head>

<script>

class IAPlayer {
  /* Interfaz base: todas las IAs deben implementar getMove(board, validCols) */
  async getMove(board, validCols) { throw new Error("getMove() no implementado"); }
}


//IA Agresive Medium  - Buena para jugar contra persona
class IA_v1 extends IAPlayer {

  constructor(playerNum, depth = 6) {
    super();
    this.playerNum = playerNum;
    this.oppNum = playerNum === 1 ? 2 : 1;
    this.depth = depth;
    this.name = "Aggressive Medium";
  }

  async getMove(board, validCols) {

    // 🥇 WIN
    for (const col of validCols) {
      const row = getLowestRow(board, col);
      board[row][col] = this.playerNum;
      if (checkWin(board, row, col, this.playerNum)) {
        board[row][col] = 0;
        return col;
      }
      board[row][col] = 0;
    }

    // 🛑 BLOCK
    for (const col of validCols) {
      const row = getLowestRow(board, col);
      board[row][col] = this.oppNum;
      if (checkWin(board, row, col, this.oppNum)) {
        board[row][col] = 0;
        return col;
      }
      board[row][col] = 0;
    }

    // ============================
    // 🟣 CAPA IA2 (intuición)
    // ============================

    // 🔥 GAP PATTERN (X . X)
    for (const col of validCols) {
      const row = getLowestRow(board, col);
      if (this._isGapPattern(board, row, col, this.playerNum)) {
        return col;
      }
    }

    // 🛑 BLOQUEAR GAP RIVAL
    for (const col of validCols) {
      const row = getLowestRow(board, col);
      if (this._isGapPattern(board, row, col, this.oppNum)) {
        return col;
      }
    }

    // 🔥 CREAR FORK
    for (const col of validCols) {
      const row = getLowestRow(board, col);
      board[row][col] = this.playerNum;

      const wins = this._countWinningMoves(board, this.playerNum);

      board[row][col] = 0;

      if (wins >= 2) return col;
    }

    // 🛑 BLOQUEAR FORK
    for (const col of validCols) {
      const row = getLowestRow(board, col);
      board[row][col] = this.oppNum;

      const wins = this._countWinningMoves(board, this.oppNum);

      board[row][col] = 0;

      if (wins >= 2) return col;
    }

    // ============================
    // 🤖 NEGAMAX
    // ============================

    const safeMoves = validCols.filter(col => !this._givesImmediateLoss(board, col));
    const moves = safeMoves.length ? safeMoves : validCols;

    let bestScore = -Infinity;
    let bestCols = [];

    for (const col of this._orderMoves(moves)) {
      const row = getLowestRow(board, col);
      board[row][col] = this.playerNum;

      const score = -this._negamax(board, this.depth - 1, -Infinity, Infinity, this.oppNum);

      board[row][col] = 0;

      // 🎲 variabilidad controlada
      const noisy = score + Math.random() * 5;

      if (noisy > bestScore) {
        bestScore = noisy;
        bestCols = [col];
      } else if (Math.abs(noisy - bestScore) < 4) {
        bestCols.push(col);
      }
    }

    return bestCols[Math.floor(Math.random() * bestCols.length)];
  }

  // ============================
  // 🟣 PATRONES IA2 CLAVE
  // ============================

  _isGapPattern(board, r, c, player) {
    if (r < 0) return false;

    // X . X horizontal
    if (c >= 2 && c <= 4) {
      return board[r][c-2] === player && board[r][c+2] === player;
    }

    return false;
  }

  _countWinningMoves(board, player) {
    let count = 0;

    for (let c = 0; c < 7; c++) {
      const r = getLowestRow(board, c);
      if (r < 0) continue;

      board[r][c] = player;
      if (checkWin(board, r, c, player)) count++;
      board[r][c] = 0;
    }

    return count;
  }

  _givesImmediateLoss(board, col) {
    const row = getLowestRow(board, col);
    if (row < 0) return true;

    board[row][col] = this.playerNum;

    const oppWins = this._countWinningMoves(board, this.oppNum);

    board[row][col] = 0;

    return oppWins > 0;
  }

  // ============================
  // 🤖 NEGAMAX
  // ============================

  _negamax(board, depth, alpha, beta, player) {
    const vc = validCols(board);

    if (depth === 0 || vc.length === 0) {
      return this._evaluate(board);
    }

    let maxEval = -Infinity;

    for (const col of this._orderMoves(vc)) {
      const row = getLowestRow(board, col);
      board[row][col] = player;

      if (checkWin(board, row, col, player)) {
        board[row][col] = 0;
        return 100000 - depth;
      }

      const next = player === this.playerNum ? this.oppNum : this.playerNum;

      const score = -this._negamax(board, depth - 1, -beta, -alpha, next);

      board[row][col] = 0;

      maxEval = Math.max(maxEval, score);
      alpha = Math.max(alpha, score);

      if (alpha >= beta) break;
    }

    return maxEval;
  }

  _orderMoves(cols) {
    const order = [3,2,4,1,5,0,6];
    return cols.slice().sort((a,b) => order.indexOf(a) - order.indexOf(b));
  }

  _evaluate(board) {
    let score = 0;

    // centro
    for (let r = 0; r < 6; r++) {
      if (board[r][3] === this.playerNum) score += 15;
      if (board[r][3] === this.oppNum) score -= 10;
    }

    const dirs = [[0,1],[1,0],[1,1],[1,-1]];

    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 7; c++) {
        for (const [dr, dc] of dirs) {
          score += this._evalWindow(board, r, c, dr, dc);
        }
      }
    }

    return score;
  }

  _evalWindow(board, r, c, dr, dc) {
    let my = 0, opp = 0, empty = 0;

    for (let i = 0; i < 4; i++) {
      const rr = r + dr * i;
      const cc = c + dc * i;

      if (rr < 0 || rr >= 6 || cc < 0 || cc >= 7) return 0;

      if (board[rr][cc] === this.playerNum) my++;
      else if (board[rr][cc] === this.oppNum) opp++;
      else empty++;
    }

    if (my > 0 && opp > 0) return 0;

    if (my === 3 && empty === 1) return 100;
    if (my === 2 && empty === 2) return 15;

    if (opp === 3 && empty === 1) return -120;
    if (opp === 2 && empty === 2) return -20;

    return 0;
  }
}


//GEMINI
class IA_v2 extends IAPlayer {
  constructor(playerNum, depth = 6) {
    super();
    this.playerNum = playerNum;
    this.oppNum = playerNum === 1 ? 2 : 1;
    this.depth = depth;
    this.name = "Legend - Gemini";
  }

  async getMove(board, validCols) {
    // 1. GANAR O BLOQUEAR (Sin excepciones)
    for (const col of validCols) {
      const row = getLowestRow(board, col);
      if (this._checkImmediateWin(board, row, col, this.playerNum)) return col;
    }
    for (const col of validCols) {
      const row = getLowestRow(board, col);
      if (this._checkImmediateWin(board, row, col, this.oppNum)) return col;
    }

    // 2. FILTRO DE SEGURIDAD GLOBAL (Copiado de la v1, es el secreto de su éxito)
    const safeMoves = validCols.filter(col => !this._givesImmediateLoss(board, col));
    const moves = safeMoves.length ? safeMoves : validCols;

    // 3. NEGAMAX CON EVALUACIÓN TÁCTICA IA2
    let bestScore = -Infinity;
    let bestCols = [];

    for (const col of this._orderMoves(moves)) {
      const row = getLowestRow(board, col);
      board[row][col] = this.playerNum;
      
      const score = -this._negamax(board, this.depth - 1, -Infinity, Infinity, this.oppNum);
      
      board[row][col] = 0;

      // Ruido controlado de la v1 para evitar bloqueos
      const noisy = score + Math.random() * 5;

      if (noisy > bestScore) {
        bestScore = noisy;
        bestCols = [col];
      } else if (Math.abs(noisy - bestScore) < 3) {
        bestCols.push(col);
      }
    }

    return bestCols[Math.floor(Math.random() * bestCols.length)];
  }

  _negamax(board, depth, alpha, beta, player) {
    const vc = validCols(board);
    if (depth === 0 || vc.length === 0) return this._evaluate(board);

    let maxEval = -Infinity;
    for (const col of this._orderMoves(vc)) {
      const row = getLowestRow(board, col);
      board[row][col] = player;
      if (checkWin(board, row, col, player)) {
        board[row][col] = 0;
        return 10000 - depth; // Valor alto pero no infinito
      }
      const next = player === this.playerNum ? this.oppNum : this.playerNum;
      const score = -this._negamax(board, depth - 1, -beta, -alpha, next);
      board[row][col] = 0;
      maxEval = Math.max(maxEval, score);
      alpha = Math.max(alpha, score);
      if (alpha >= beta) break;
    }
    return maxEval;
  }

  _evaluate(board) {
    let score = 0;
    
    // Control Central (IA2 valora mucho el centro)
    for (let r = 0; r < 6; r++) {
      if (board[r][3] === this.playerNum) score += 15;
      if (board[r][3] === this.oppNum) score -= 15;
    }

    // Evaluación de Ventanas (v1) + Bonus de Patrones (IA2)
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 7; c++) {
        for (const [dr, dc] of dirs) {
          score += this._evalWindowTactical(board, r, c, dr, dc);
        }
      }
    }
    return score;
  }

  _evalWindowTactical(board, r, c, dr, dc) {
    let my = 0, opp = 0, empty = 0;
    for (let i = 0; i < 4; i++) {
      const rr = r + dr * i, cc = c + dc * i;
      if (rr < 0 || rr >= 6 || cc < 0 || cc >= 7) return 0;
      if (board[rr][cc] === this.playerNum) my++;
      else if (board[rr][cc] === this.oppNum) opp++;
      else empty++;
    }

    if (my > 0 && opp > 0) return 0;

    // Valores equilibrados para que el Negamax pueda "pensar"
    if (my === 3 && empty === 1) return 80;
    if (my === 2 && empty === 2) return 20;

    if (opp === 3 && empty === 1) return -100;
    if (opp === 2 && empty === 2) return -30;

    return 0;
  }

  _givesImmediateLoss(board, col) {
    const row = getLowestRow(board, col);
    if (row < 0) return true;
    board[row][col] = this.playerNum;
    
    // Si después de mi movimiento, el oponente tiene ALGUNA forma de ganar, es peligroso.
    let oppCanWin = false;
    for (let c = 0; c < 7; c++) {
      const r = getLowestRow(board, c);
      if (r < 0) continue;
      board[r][c] = this.oppNum;
      if (checkWin(board, r, c, this.oppNum)) oppCanWin = true;
      board[r][c] = 0;
      if (oppCanWin) break;
    }
    board[row][col] = 0;
    return oppCanWin;
  }

  _checkImmediateWin(board, r, c, p) {
    board[r][c] = p;
    const win = checkWin(board, r, c, p);
    board[r][c] = 0;
    return win;
  }

  _orderMoves(cols) {
    const order = [3,2,4,1,5,0,6];
    return cols.slice().sort((a,b) => order.indexOf(a) - order.indexOf(b));
  }
}


/* ═══════════════════════════════════════════════════════════════════
   GAME LOGIC
═══════════════════════════════════════════════════════════════════ */
const ROWS = 6, COLS = 7;

let board, currentPlayer, gameOver, busy;
let players   = {};   // { 1:{type,ai}, 2:{type,ai} }
let scores    = {1:0, 2:0};
let setupVals = {1:'human', 2:'human'};

/* ── helpers ── */
function freshBoard() { return Array.from({length:ROWS}, ()=>Array(COLS).fill(0)); }

function getLowestRow(b, col) {
  for (let r = ROWS-1; r >= 0; r--) if (b[r][col] === 0) return r;
  return -1;
}

function validCols(b) {
  return Array.from({length:COLS},(_,i)=>i).filter(c => b[0][c] === 0);
}

function checkWin(b, row, col, p) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    const cells = [[row,col]];
    for (let d=1;d<=3;d++){
      const [r,c] = [row+dr*d, col+dc*d];
      if (r>=0&&r<ROWS&&c>=0&&c<COLS&&b[r][c]===p) cells.push([r,c]); else break;
    }
    for (let d=1;d<=3;d++){
      const [r,c] = [row-dr*d, col-dc*d];
      if (r>=0&&r<ROWS&&c>=0&&c<COLS&&b[r][c]===p) cells.push([r,c]); else break;
    }
    if (cells.length >= 4) return cells;
  }
  return null;
}


/* ═══════════════════════════════════════════════════════════════════
   UI — SETUP
═══════════════════════════════════════════════════════════════════ */
document.querySelectorAll('.toggle').forEach(tg => {
  tg.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      tg.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setupVals[tg.id === 't1' ? 1 : 2] = btn.dataset.v;
      refreshDesc();
    });
  });
});

function refreshDesc() {
  const n = v => v === 'human' ? 'Humano' : 'IA';
  document.getElementById('match-desc').textContent =
    `${n(setupVals[1])} vs ${n(setupVals[2])}`;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goSetup() { showScreen('s-setup'); }


/* ═══════════════════════════════════════════════════════════════════
   UI — GAME
═══════════════════════════════════════════════════════════════════ */
function startGame() {
  [1,2].forEach(p => {
    const t = setupVals[p];
	
	let ai = null;

	switch (t) {
	  case 'ai-1':
		ai = new IA_v1(p);
		break;

	  case 'ai-2':
		ai = new IA_v2(p);
		break;

	  default:
		ai = null;
	}

	players[p] = { 
	  type: t,
	  ai
	};

    document.getElementById(`badge${p}`).textContent = t.startsWith('ai') ? ('IA ' + players[p].ai.name) : 'Humano';
  });
  scores = {1:0,2:0};
  renderScores();
  showScreen('s-game');
  initRound();
}

function reMatch() { initRound(); }

function initRound() {
  board         = freshBoard();
  currentPlayer = 1;
  gameOver      = false;
  busy          = false;

  document.getElementById('overlay').classList.remove('show');
  buildBoardDOM();
  buildDropzone();
  highlightCard();
  setStatus(`Turno de <b>Jugador 1</b>${players[1].type.startsWith('ai') ? ('<span class="ai-tag">IA' + players[1].type + '</span>') : ''}`);

  if (players[1].type.startsWith('ai')) setTimeout(runAI, 500);
}

/* ── board DOM ── */
function buildBoardDOM() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    const d = document.createElement('div');
    d.className = 'cell';
    d.dataset.r = r; d.dataset.c = c;
    el.appendChild(d);
  }
}

function getCell(r,c) {
  return document.querySelector(`#board .cell[data-r="${r}"][data-c="${c}"]`);
}

/* ── dropzone ── */
function buildDropzone() {
  const dz = document.getElementById('dz');
  dz.innerHTML = '';
  for (let c=0;c<COLS;c++) {
    const col = document.createElement('div');
    col.className = 'dropcol';
    col.dataset.c = c;
    const arrow = document.createElement('div');
    arrow.className = `droparrow c${currentPlayer}`;
    arrow.id = `arr${c}`;
    col.appendChild(arrow);
    col.addEventListener('click', () => humanClick(c));
    dz.appendChild(col);
  }
}

function refreshArrows() {
  document.querySelectorAll('.droparrow').forEach(a => {
    a.className = `droparrow c${currentPlayer}`;
  });
}

/* ── status ── */
function setStatus(html) { document.getElementById('status').innerHTML = html; }

function setThinking() {
  const n = currentPlayer;
  setStatus(
    `<span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>` +
    ` IA ${name} pensando…`
  );
}

/* ── score ── */
function renderScores() {
  document.getElementById('sc1').textContent = scores[1];
  document.getElementById('sc2').textContent = scores[2];
}

/* ── active card highlight ── */
function highlightCard() {
  [1,2].forEach(p => {
    document.getElementById(`card${p}`).classList.toggle('active', p===currentPlayer);
  });
}


/* ═══════════════════════════════════════════════════════════════════
   MOVE HANDLING
═══════════════════════════════════════════════════════════════════ */
async function humanClick(col) {
  if (gameOver || busy) return;
  if (players[currentPlayer].type !== 'human') return;
  const row = getLowestRow(board, col);
  if (row < 0) return;
  await doMove(row, col);
}

async function runAI() {
  if (gameOver || busy) return;
  busy = true;
  setThinking();
  const vc  = validCols(board);
  const col = await players[currentPlayer].ai.getMove(board.map(r=>[...r]), vc);
  if (gameOver) { busy=false; return; }
  const row = getLowestRow(board, col);
  busy = false;
  await doMove(row, col);
}

async function doMove(row, col) {
  if (busy && players[currentPlayer].type === 'human') return; // doble-click guard
  busy = true;

  board[row][col] = currentPlayer;

  /* calculate fall distance for animation */
  const totalCells = row + 1;  // rows to travel (row 0 = top)
  const cellPx     = 76 + 9;   // cell + gap
  const fallFrom   = `-${totalCells * cellPx + 50}px`;

  const cell = getCell(row, col);
  cell.classList.add(`p${currentPlayer}`);
  cell.style.setProperty('--fall-from', fallFrom);
  cell.classList.add('falling');
  cell.addEventListener('animationend', () => cell.classList.remove('falling'), {once:true});

  await sleep(420);

  /* check win */
  const won = checkWin(board, row, col, currentPlayer);
  if (won) {
    won.forEach(([wr,wc]) => getCell(wr,wc).classList.add('win-cell'));
    scores[currentPlayer]++;
    renderScores();
    await sleep(200);
    showEndMsg(currentPlayer, false);
    gameOver = true; busy = false;
    return;
  }

  /* check draw */
  if (validCols(board).length === 0) {
    await sleep(200);
    showEndMsg(null, true);
    gameOver = true; busy = false;
    return;
  }

  currentPlayer = currentPlayer===1 ? 2 : 1;
  highlightCard();
  refreshArrows();
  const n = currentPlayer;
  const typeTag = players[n].type.startsWith('ai') ? '<span class="ai-tag">IA</span>' : '';
  setStatus(`Turno de <b>Jugador ${n}</b>${typeTag}`);
  busy = false;

  if (players[currentPlayer].type.startsWith('ai')) {
    setTimeout(runAI, 350);
  }
}

function showEndMsg(winner, draw) {
  const overlay = document.getElementById('overlay');
  const msg     = document.getElementById('win-msg');

  if (draw) {
    msg.className = 'win-msg draw';
    msg.textContent = '¡Empate!';
  } else {
    const typeLabel = players[winner].type.startsWith('ai') ? players[winner].ai.name : '';
    msg.className = `win-msg c${winner}`;
    msg.textContent = `🏆 Jugador ${winner} ${typeLabel} gana`;
  }
  overlay.classList.add('show');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* boot */
refreshDesc();
</script>
